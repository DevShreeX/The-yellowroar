<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

/* HEADER */
header {
  text-align: center;
  background: linear-gradient(90deg, #ffcc00, #0046ad);
  color: white;
  padding: 20px;
}

/* NAV */
nav {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 20px;
  background-color: #ffcc00;
  padding: 10px;
  flex-wrap: wrap;
}

nav a {
  text-decoration: none;
  color: black;
  font-weight: bold;
}

/* HERO */
.hero {
  height: 80vh;
  background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.8)),
  url("https://upload.wikimedia.org/wikipedia/commons/2/2b/M_A_Chidambaram_Stadium.jpg");
  background-size: cover;
  background-position: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: white;
}

.hero h1 {
  color: #ffd700;
  font-size: 45px;
}

.hero p {
  margin-top: 10px;
}

/* BUTTON */
.btn {
  margin-top: 20px;
  padding: 12px 25px;
  background: #ffd700;
  border: none;
  cursor: pointer;
  font-weight: bold;
}

/* SECTION */
.section {
  padding: 50px;
  text-align: center;
  background: #111;
  color: white;
}

.section h2 {
  color: #ffd700;
  margin-bottom: 30px;
}

.cards {
  display: flex;
  justify-content: center;
  gap: 20px;
  flex-wrap: wrap;
}

.card {
  background: #1c1c1c;
  padding: 15px;
  border-radius: 10px;
  width: 220px;
  text-align: center;
}

.card img {
  width: 100%;
  border-radius: 10px;
}

.card h3 {
  color: #ffd700;
  margin-top: 10px;
}

/* FOOTER */
footer {
  text-align: center;
  padding: 15px;
  background: black;
  color: #aaa;
}
</style>
