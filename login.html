<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Chennai Super Kings</title>
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <div class="form-box">
    <div class="logo-container">
      <img src="assets/images/leo macsot.png" alt="CSK Mascot" width="100" style="margin-bottom: 10px;">
    </div>
    <h2><i># Welcome to the Yellow Family 💛</i></h2>
    <p style="color: #666; font-size: 0.9em; margin-bottom: 20px;">Enter your username to join the roar!</p>
    <form id="loginForm">
      <input type="text" id="usernameInput" placeholder="Choose a Username" required minlength="3">
      <button type="submit">Enter Fan Zone</button>
    </form>
  </div>

  <script type="module">
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const username = document.getElementById('usernameInput').value.trim();
      if (username) {
        localStorage.setItem('csk_username', username);
        
        let uuid = localStorage.getItem('csk_user_uuid');
        if (!uuid) {
          uuid = 'id-' + Math.random().toString(36).substr(2, 9) + '-' + Date.now();
          localStorage.setItem('csk_user_uuid', uuid);
        }
        
        // Redirect to home page
        window.location.href = 'index.html';
      }
    });

    // If already logged in, redirect to home
    window.addEventListener('DOMContentLoaded', () => {
      if (localStorage.getItem('csk_username') && localStorage.getItem('csk_user_uuid')) {
        window.location.href = 'index.html';
      }
    });
  </script>
</body>
</html>
